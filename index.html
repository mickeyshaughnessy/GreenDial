<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenDial - Your Health Assistant</title>
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --user-bubble: #10b981;
      --bot-bubble: #f1f5f9;
    }
    
    [data-theme="dark"] {
      --primary: #10b981;
      --primary-dark: #059669;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --bot-bubble: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .hidden { display: none !important; }

    .app-header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }

    .app-header h1 {
      color: var(--primary);
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-header h1::before {
      content: "";
      width: 24px;
      height: 24px;
      background: var(--primary);
      border-radius: 50%;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .status-badge.guest { background: #fef3c7; color: #92400e; }
    .status-badge.logged-in { background: #d1fae5; color: #065f46; }

    .logout-btn {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
    }

    /* Main Layout */
    .main-container {
      display: flex;
      height: calc(100vh - 56px);
      padding: 16px;
      gap: 16px;
    }

    /* Chat - Left Column */
    .chat-column {
      width: 45%;
      min-width: 350px;
      display: flex;
      flex-direction: column;
    }

    /* Right Column - Widgets */
    .widgets-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .widgets-row {
      display: flex;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    /* Widget Base */
    .widget {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    .widget-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }

    .widget-header h2 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .widget-body {
      padding: 12px 16px;
      overflow-y: auto;
      flex: 1;
    }

    /* Jiggle Animation */
    @keyframes jiggle {
      0% { transform: rotate(-0.5deg) scale(0.99); }
      25% { transform: rotate(0.5deg) scale(1.005); }
      50% { transform: rotate(-0.3deg) scale(1); }
      75% { transform: rotate(0.3deg) scale(1); }
      100% { transform: rotate(0deg) scale(1); }
    }

    .widget.jiggle { animation: jiggle 0.4s ease-out forwards; }
    .widgets-row:nth-child(1) .widget { animation-delay: 0.1s; }
    .widgets-row:nth-child(2) .widget:nth-child(1) { animation-delay: 0.2s; }
    .widgets-row:nth-child(2) .widget:nth-child(2) { animation-delay: 0.3s; }

    /* Chat Widget */
    .chat-widget {
      height: 100%;
    }

    .chat-widget .widget-body {
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 85%;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    
    .message.system {
      align-self: center;
      max-width: 90%;
    }

    .message.suggestion {
      align-self: flex-start;
      max-width: 90%;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 12px;
      flex-shrink: 0;
    }

    .message.user .message-avatar { background: var(--text-muted); }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.4;
      font-size: 14px;
    }

    .message.bot .message-bubble {
      background: var(--bot-bubble);
      border-bottom-left-radius: 4px;
    }

    .message.user .message-bubble {
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 4px;
    }
    
    .message.system .message-bubble {
      background: #d1fae5;
      color: #065f46;
      text-align: center;
      font-size: 13px;
    }

    .message.suggestion .message-bubble {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-bottom-left-radius: 4px;
    }

    .suggestion-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 10px 14px;
      background: var(--bot-bubble);
      border-radius: 14px;
      width: fit-content;
    }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-3px); }
    }

    .chat-input-container {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--card);
    }

    .chat-input-form {
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
    }

    .chat-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .send-btn:hover { background: var(--primary-dark); }
    .send-btn svg { width: 18px; height: 18px; fill: white; }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .stat-card h3 {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card .value {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
    }

    /* Goals in Dashboard */
    .goals-section h4 {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .goal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: var(--bg);
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .goal-text.completed { text-decoration: line-through; color: var(--text-muted); }

    .add-goal-form {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .add-goal-form input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
    }

    /* Messages */
    .message-item {
      padding: 10px;
      background: var(--bg);
      border-radius: 8px;
      margin-bottom: 8px;
      border-left: 3px solid transparent;
      font-size: 13px;
    }

    .message-item.unread { border-left-color: var(--primary); }

    .message-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .message-from { font-weight: 600; color: var(--primary); font-size: 12px; }
    .message-time { font-size: 10px; color: var(--text-muted); }

    /* Profile JSON */
    .profile-json {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text);
      max-height: 100%;
      overflow-y: auto;
    }

    /* Settings */
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .setting-row:last-child { border-bottom: none; }

    .setting-control select {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      background: var(--bg);
      color: var(--text);
    }

    .theme-picker {
      display: flex;
      gap: 4px;
    }

    .theme-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .theme-btn.active { border-color: var(--text); }
    .theme-btn[data-theme="light"] { background: #f8fafc; border: 1px solid #e2e8f0; }
    .theme-btn[data-theme="dark"] { background: linear-gradient(135deg, #1e293b, #0f172a); }

    /* Buttons */
    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-sm { padding: 4px 8px; font-size: 11px; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-muted { background: var(--text-muted); color: white; }
    .btn-blue { background: #3b82f6; color: white; }

    .empty-state {
      text-align: center;
      padding: 16px;
      color: var(--text-muted);
      font-size: 13px;
    }

    @media (max-width: 900px) {
      .main-container {
        flex-direction: column;
        overflow-y: auto;
      }
      .chat-column {
        width: 100%;
        min-width: unset;
        height: 50vh;
      }
      .widgets-column { overflow: visible; }
      .widgets-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>GreenDial</h1>
    <div class="user-info">
      <span id="status-badge" class="status-badge guest">Guest</span>
      <span id="display-username" style="color: var(--text-muted); font-size: 14px;"></span>
      <button id="logout-btn" class="logout-btn hidden" onclick="logout()">Sign Out</button>
    </div>
  </header>

  <div class="main-container">
    <!-- Left: Chat -->
    <div class="chat-column">
      <div class="widget chat-widget jiggle">
        <div class="widget-header">
          <h2>💬 Chat with Doc</h2>
        </div>
        <div class="widget-body">
          <div id="chat-messages" class="chat-messages">
            <div class="message bot">
              <div class="message-avatar">D</div>
              <div class="message-bubble">Hello! I'm Doc, your health assistant. Say "sign up" to create an account.</div>
            </div>
          </div>
          <div class="chat-input-container">
            <form id="chat-form" class="chat-input-form">
              <input type="text" id="chat-input" class="chat-input" placeholder="Type a message..." autocomplete="off">
              <button type="submit" class="send-btn">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Widgets -->
    <div class="widgets-column">
      <div class="widgets-row">
        <!-- Dashboard + Goals -->
        <div class="widget jiggle" data-widget="dashboard">
          <div class="widget-header">
            <h2>📊 Dashboard</h2>
          </div>
          <div class="widget-body">
            <div class="stats-grid">
              <div class="stat-card">
                <h3>Sessions</h3>
                <div class="value" id="stat-sessions">1</div>
              </div>
              <div class="stat-card">
                <h3>Records</h3>
                <div class="value" id="stat-records">0</div>
              </div>
              <div class="stat-card">
                <h3>Goals</h3>
                <div class="value" id="stat-goals">0</div>
              </div>
              <div class="stat-card">
                <h3>Days</h3>
                <div class="value" id="stat-days">1</div>
              </div>
            </div>
            <div class="goals-section">
              <h4>🎯 Goals</h4>
              <div id="goals-list"></div>
              <div class="add-goal-form">
                <input type="text" id="new-goal-input" placeholder="Add goal...">
                <button class="btn btn-primary btn-sm" onclick="createGoal()">Add</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Messages -->
        <div class="widget jiggle" data-widget="messages">
          <div class="widget-header">
            <h2>📬 Messages <span id="msg-badge" class="hidden" style="background: var(--primary); color: white; padding: 2px 6px; border-radius: 8px; font-size: 10px; margin-left: 4px;">0</span></h2>
          </div>
          <div class="widget-body">
            <div id="messages-list">
              <div class="empty-state">No messages yet.</div>
            </div>
          </div>
        </div>
      </div>

      <div class="widgets-row">
        <!-- Profile JSON -->
        <div class="widget jiggle" data-widget="profile">
          <div class="widget-header">
            <h2>👤 Profile</h2>
          </div>
          <div class="widget-body" style="padding: 12px;">
            <div id="profile-display" class="profile-json">{ "status": "Not logged in" }</div>
          </div>
        </div>

        <!-- Settings -->
        <div class="widget jiggle" data-widget="settings">
          <div class="widget-header">
            <h2>⚙️ Settings</h2>
          </div>
          <div class="widget-body">
            <div class="setting-row">
              <span>Doc's Style</span>
              <select id="doc-style">
                <option value="default">Balanced</option>
                <option value="coach">Coach</option>
                <option value="clinical">Clinical</option>
                <option value="friendly">Friendly</option>
              </select>
            </div>
            <div class="setting-row">
              <span>Theme</span>
              <div class="theme-picker">
                <button class="theme-btn active" data-theme="light" title="Light"></button>
                <button class="theme-btn" data-theme="dark" title="Dark"></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    let currentUser = null;
    let sessionId = null;

    function init() {
      const stored = localStorage.getItem('greendial_user');
      if (stored) {
        try {
          currentUser = JSON.parse(stored);
          sessionId = currentUser.session_id;
          updateUI();
          loadAllData();
        } catch(e) {
          localStorage.removeItem('greendial_user');
        }
      }
      if (!sessionId) sessionId = 'anon_' + Date.now();
      
      const savedTheme = localStorage.getItem('greendial_theme') || 'light';
      setTheme(savedTheme);
      
      setTimeout(() => {
        document.querySelectorAll('.widget').forEach(w => w.classList.add('jiggle'));
      }, 100);
    }

    function loadAllData() {
      loadStats();
      loadGoals();
      loadMessages();
      loadProfile();
      loadSuggestionsAsMessages();
    }

    function updateUI() {
      const badge = document.getElementById('status-badge');
      const username = document.getElementById('display-username');
      const logoutBtn = document.getElementById('logout-btn');
      
      if (currentUser?.user_id) {
        badge.textContent = 'Logged In';
        badge.className = 'status-badge logged-in';
        username.textContent = currentUser.username;
        logoutBtn.classList.remove('hidden');
      } else {
        badge.textContent = 'Guest';
        badge.className = 'status-badge guest';
        username.textContent = '';
        logoutBtn.classList.add('hidden');
      }
    }

    function logout() {
      currentUser = null;
      sessionId = 'anon_' + Date.now();
      localStorage.removeItem('greendial_user');
      updateUI();
      document.getElementById('profile-display').textContent = '{ "status": "Not logged in" }';
      document.getElementById('chat-messages').innerHTML = `
        <div class="message bot">
          <div class="message-avatar">D</div>
          <div class="message-bubble">Signed out. Say "login" to sign back in.</div>
        </div>
      `;
    }

    function setTheme(theme) {
      document.body.setAttribute('data-theme', theme === 'dark' ? 'dark' : '');
      localStorage.setItem('greendial_theme', theme);
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === theme);
      });
    }

    // Chat
    function addMessage(text, type = 'bot', extra = null) {
      const messages = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = `message ${type}`;
      
      if (type === 'system') {
        div.innerHTML = `<div class="message-bubble">${text}</div>`;
      } else if (type === 'suggestion') {
        const suggestionId = extra?.id || '';
        const isRseEligible = extra?.rse_eligible;
        div.innerHTML = `
          <div class="message-avatar">💡</div>
          <div class="message-bubble">
            <div style="font-size: 11px; color: #92400e; margin-bottom: 4px;">Suggestion from Doc</div>
            ${text}
            ${isRseEligible ? `<div class="suggestion-actions">
              <button class="btn btn-sm btn-blue" onclick="submitToRse('${suggestionId}')">Get Service Bids</button>
              <button class="btn btn-sm btn-muted" onclick="dismissSuggestion('${suggestionId}')">Dismiss</button>
            </div>` : ''}
          </div>
        `;
      } else {
        const initials = type === 'user' ? (currentUser?.username?.[0]?.toUpperCase() || 'U') : 'D';
        div.innerHTML = `
          <div class="message-avatar">${initials}</div>
          <div class="message-bubble">${text}</div>
        `;
      }
      
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function showTyping() {
      const messages = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.id = 'typing';
      div.className = 'message bot';
      div.innerHTML = `
        <div class="message-avatar">D</div>
        <div class="typing-indicator"><span></span><span></span><span></span></div>
      `;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function hideTyping() {
      document.getElementById('typing')?.remove();
    }

    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      addMessage(text, 'user');
      showTyping();

      try {
        const resp = await fetch(`${API}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, user_id: currentUser?.user_id, session_id: sessionId })
        });
        const data = await resp.json();
        hideTyping();
        
        if (data.auth) {
          currentUser = {
            user_id: data.auth.user_id,
            username: data.auth.username,
            session_id: sessionId
          };
          localStorage.setItem('greendial_user', JSON.stringify(currentUser));
          updateUI();
          addMessage(`Logged in as ${data.auth.username}`, 'system');
          sessionId = 'private_' + Date.now();
          currentUser.session_id = sessionId;
          localStorage.setItem('greendial_user', JSON.stringify(currentUser));
          loadAllData();
        }
        
        addMessage(data.response, 'bot');
      } catch (err) {
        hideTyping();
        addMessage('Connection error. Please try again.', 'bot');
      }
    });

    // Goals
    async function loadGoals() {
      if (!currentUser) {
        document.getElementById('goals-list').innerHTML = '<div class="empty-state">Log in to track goals</div>';
        return;
      }
      
      try {
        const resp = await fetch(`${API}/goals/${currentUser.user_id}`);
        const data = await resp.json();
        const goals = data.goals || [];
        
        const container = document.getElementById('goals-list');
        if (goals.length === 0) {
          container.innerHTML = '<div class="empty-state">No goals yet</div>';
          return;
        }
        
        container.innerHTML = goals.slice(0, 5).map(g => `
          <div class="goal-item">
            <span class="goal-text ${g.completed ? 'completed' : ''}">${g.text}</span>
            <div style="display: flex; gap: 4px;">
              <button onclick="toggleGoal('${g.id}', ${!g.completed})" class="btn btn-sm ${g.completed ? 'btn-muted' : 'btn-primary'}">${g.completed ? '↩' : '✓'}</button>
              <button onclick="deleteGoal('${g.id}')" class="btn btn-sm btn-danger">×</button>
            </div>
          </div>
        `).join('');
      } catch(e) {}
    }

    async function createGoal() {
      if (!currentUser) { alert('Please log in.'); return; }
      const input = document.getElementById('new-goal-input');
      const text = input.value.trim();
      if (!text) return;
      
      try {
        await fetch(`${API}/goal/${currentUser.user_id}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, type: 'health' })
        });
        input.value = '';
        loadGoals();
        loadStats();
      } catch(e) {}
    }

    async function toggleGoal(goalId, completed) {
      if (!currentUser) return;
      await fetch(`${API}/goal/${currentUser.user_id}/${goalId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed, progress: completed ? 100 : 0 })
      });
      loadGoals();
    }

    async function deleteGoal(goalId) {
      if (!currentUser) return;
      await fetch(`${API}/goal/${currentUser.user_id}/${goalId}`, { method: 'DELETE' });
      loadGoals();
      loadStats();
    }

    // Stats
    async function loadStats() {
      if (!currentUser) return;
      try {
        const resp = await fetch(`${API}/stats/${currentUser.user_id}`);
        const stats = await resp.json();
        document.getElementById('stat-sessions').textContent = stats.conversations || 1;
        document.getElementById('stat-records').textContent = stats.records || 0;
        document.getElementById('stat-goals').textContent = stats.goals || 0;
        document.getElementById('stat-days').textContent = stats.days_active || 1;
      } catch(e) {}
    }

    // Messages
    async function loadMessages() {
      if (!currentUser) {
        document.getElementById('messages-list').innerHTML = '<div class="empty-state">Log in to see messages</div>';
        return;
      }
      try {
        const resp = await fetch(`${API}/doc/messages/${currentUser.user_id}`);
        const data = await resp.json();
        const messages = data.messages || [];
        
        const container = document.getElementById('messages-list');
        if (messages.length === 0) {
          container.innerHTML = '<div class="empty-state">No messages yet</div>';
        } else {
          container.innerHTML = messages.slice(0, 10).map(m => `
            <div class="message-item ${m.read ? '' : 'unread'}">
              <div class="message-header">
                <span class="message-from">Doc</span>
                <span class="message-time">${new Date(m.timestamp).toLocaleDateString()}</span>
              </div>
              <div style="font-size: 13px;">${m.message}</div>
            </div>
          `).join('');
          
          const unread = messages.filter(m => !m.read).length;
          const badge = document.getElementById('msg-badge');
          if (unread > 0) {
            badge.textContent = unread;
            badge.classList.remove('hidden');
          } else {
            badge.classList.add('hidden');
          }
        }
      } catch(e) {}
    }

    // Profile
    async function loadProfile() {
      if (!currentUser) {
        document.getElementById('profile-display').textContent = '{ "status": "Not logged in" }';
        return;
      }
      try {
        const resp = await fetch(`${API}/user/${currentUser.user_id}`);
        const user = await resp.json();
        const profile = user.profile || {};
        document.getElementById('profile-display').textContent = JSON.stringify(profile, null, 2) || '{}';
      } catch(e) {
        document.getElementById('profile-display').textContent = '{ "error": "Failed to load" }';
      }
    }

    // Suggestions as chat messages
    async function loadSuggestionsAsMessages() {
      if (!currentUser) return;
      try {
        const resp = await fetch(`${API}/suggestions/${currentUser.user_id}`);
        const data = await resp.json();
        const suggestions = data.suggestions || [];
        
        suggestions.slice(0, 3).forEach(s => {
          if (!s.dismissed) {
            addMessage(s.text, 'suggestion', s);
          }
        });
      } catch(e) {}
    }

    async function submitToRse(suggestionId) {
      if (!currentUser) return;
      try {
        const resp = await fetch(`${API}/suggestion/${currentUser.user_id}/${suggestionId}/submit-rse`, { method: 'POST' });
        const data = await resp.json();
        if (data.success) {
          addMessage('Service request submitted to RSE. Providers will bid on it!', 'system');
        } else {
          addMessage(data.error || 'Failed to submit', 'system');
        }
      } catch(e) {}
    }
    
    async function dismissSuggestion(suggestionId) {
      if (!currentUser) return;
      await fetch(`${API}/suggestion/${currentUser.user_id}/${suggestionId}/dismiss`, { method: 'POST' });
      // Remove from chat
      document.querySelectorAll('.message.suggestion').forEach(el => {
        if (el.innerHTML.includes(suggestionId)) el.remove();
      });
    }

    // Settings
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => setTheme(btn.dataset.theme));
    });

    document.getElementById('doc-style').addEventListener('change', async (e) => {
      if (!currentUser) return;
      await fetch(`${API}/settings/${currentUser.user_id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ doc_style: e.target.value })
      });
    });

    init();
  </script>
</body>
</html>
